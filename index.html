<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mo&Zo Talk</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <!-- First screen = your merged poster -->
    <section class="first-screen">
      <!-- Clickable hotspots over the brush-stroke nav labels -->
      <a href="#converter" class="nav-hotspot hotspot-converter" aria-label="Converter"></a>
      <a href="#stories" class="nav-hotspot hotspot-stories" aria-label="Stories to tell"></a>
      <a href="#firmer-faith" class="nav-hotspot hotspot-firmer" aria-label="Firmer faith"></a>
      <a href="#original-believer" class="nav-hotspot hotspot-original" aria-label="Original believer"></a>
    </section>

    <!-- Placeholder sections so you can scroll after clicking -->
    <section id="converter" class="content-section">
      <h2>Converter</h2>
      <p>Content for converts will go here.</p>
    </section>

    <section id="stories" class="content-section">
      <h2>Stories to tell</h2>
      <p>Stories section content placeholder.</p>
    </section>

    <section id="firmer-faith" class="content-section">
      <h2>Firmer faith</h2>
      <p>Firmer faith content placeholder.</p>
    </section>

    <section id="original-believer" class="content-section">
      <h2>Original believer</h2>
      <p>Original believer content placeholder.</p>
    </section>
  </main>
</body>
</html>
